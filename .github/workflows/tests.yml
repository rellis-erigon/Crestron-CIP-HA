name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon:
    name: Add-on tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pytest-asyncio pytest-aiohttp aiohttp
      - name: Run add-on tests
        run: pytest crestron-cip/tests -q
