name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-detail:
    name: No site-specific detail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # This repository is public and was developed against a working
      # building. A real address or room number in it tells a reader how
      # that estate is laid out, so this is a build check rather than care.
      - name: Check
        run: python3 scripts/check-no-site-detail.py

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Plain scripts with no dependencies: the tests load the protocol and
      # client without Home Assistant (see tests/_pkg.py).
      - name: Run tests
        run: |
          python3 tests/test_protocol.py
          python3 tests/test_integration.py
          python3 tests/test_connection.py
          python3 tests/test_project_loader.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
