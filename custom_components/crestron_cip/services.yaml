press:
  name: Press (pulse digital)
  description: Momentarily assert a digital join (button press), then release.
  fields:
    join:
      name: Join
      description: Digital join number (1-based).
      required: true
      example: 12
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    duration:
      name: Duration
      description: Hold time in seconds before release.
      required: false
      example: 0.1
      selector:
        number:
          min: 0.05
          max: 10
          step: 0.05
          mode: box
    entry_id:
      name: Config entry
      description: Target a specific Crestron connection (optional; defaults to all).
      required: false
      selector:
        config_entry:
          integration: crestron_cip
    smart_object:
      name: SmartObject
      description: For a join inside a SmartObject, such as a list item, its object id.
      required: false
      selector:
        number:
          min: 1
          max: 65535
          mode: box

set_digital:
  name: Set digital
  description: Hold a digital join high or low.
  fields:
    join: { name: Join, required: true, selector: { number: { min: 1, max: 65535, mode: box } } }
    value: { name: Value, required: true, selector: { boolean: {} } }
    entry_id: { name: Config entry, required: false, selector: { config_entry: { integration: crestron_cip } } }
    smart_object: { name: SmartObject, required: false, selector: { number: { min: 1, max: 65535, mode: box } } }

set_analog:
  name: Set analog
  description: Set a 16-bit analog join value (0-65535).
  fields:
    join: { name: Join, required: true, selector: { number: { min: 1, max: 65535, mode: box } } }
    value: { name: Value, required: true, selector: { number: { min: 0, max: 65535, mode: box } } }
    entry_id: { name: Config entry, required: false, selector: { config_entry: { integration: crestron_cip } } }
    smart_object: { name: SmartObject, required: false, selector: { number: { min: 1, max: 65535, mode: box } } }

set_serial:
  name: Set serial
  description: Send a string to a serial join.
  fields:
    join: { name: Join, required: true, selector: { number: { min: 1, max: 65535, mode: box } } }
    value: { name: Text, required: true, selector: { text: {} } }
    entry_id: { name: Config entry, required: false, selector: { config_entry: { integration: crestron_cip } } }
    smart_object: { name: SmartObject, required: false, selector: { number: { min: 1, max: 65535, mode: box } } }

request_update:
  name: Request update
  description: Ask the processor to re-send the current state of all joins.
  fields:
    entry_id: { name: Config entry, required: false, selector: { config_entry: { integration: crestron_cip } } }

import_panel:
  name: Import panel
  description: >-
    Read a panel project (.c3p or the panel's .zip) and write every screen
    and its artwork under www/crestron-panels, for crestron-panel-card.
  fields:
    path:
      name: Path
      description: The project file, under the config, share or media folder.
      required: true
      example: /share/Orchard1-TP.zip
      selector:
        text: {}
    name:
      name: Name
      description: What to call the panel. Defaults to the file name.
      required: false
      example: Orchard Room 1
      selector:
        text: {}
