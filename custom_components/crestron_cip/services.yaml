rescan:
  name: Re-scan joins
  description: >-
    Ask the add-on to re-read joins from the Crestron processor. Use this after a
    change on the processor rather than waiting for a reconnect.
  fields:
    processor:
      name: Crestron processor
      description: Limit the scan to one processor. Omit to scan all of them.
      required: false
      selector:
        text:

generate_room_card:
  name: Generate room card
  description: >-
    Build a room-controller-card for a processor by matching its exposed
    joins to room roles by name. Returns the card, its YAML, and what the
    match decided — check that before trusting it.
  fields:
    processor:
      name: Crestron processor
      description: Which processor's joins to use. Omit to use all of them.
      required: false
      selector:
        text:

generate_panel_card:
  name: Generate panel card
  description: >-
    The XPanel imported in the add-on, as a card with real entity ids.
    Import the panel with its processor address first so the joins exist.

generate_mixer_card:
  name: Generate mixer card
  description: >-
    The zone-mixer console built in the add-on, as a card with real
    entity ids. Group the zones and expose their joins first.
  fields:
    processor:
      name: Crestron processor
      description: Which processor's zones to use.
      required: false
      selector:
        text:
    roles:
      name: Properties
      description: >-
        What each channel carries, as role:signal:offset — for example
        volume:a:0,mute:d:0. Omit for the add-on's default.
      required: false
      selector:
        text:
    per_row:
      name: Strips per row
      description: The console wraps past this. Eight by default.
      required: false
      selector:
        number:
          min: 1
          max: 16
